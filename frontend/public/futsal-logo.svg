<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Shield/Badge -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="#0F172A"/>
  
  <!-- Outer Glow Ring / Pitch Outer Bounds -->
  <rect x="64" y="64" width="384" height="384" rx="64" fill="none" stroke="#3B82F6" stroke-width="12" stroke-opacity="0.4"/>
  
  <!-- Minimalist Futsal Ball / Tactical Hub -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#38BDF8" stroke-width="16"/>
  
  <!-- Central Pentagon -->
  <polygon points="256,176 200,216 222,282 290,282 312,216" fill="#38BDF8"/>
  
  <!-- Tactical Lines / Pitch Center Marking -->
  <line x1="256" y1="64" x2="256" y2="116" stroke="#38BDF8" stroke-width="12" stroke-linecap="round"/>
  <line x1="256" y1="396" x2="256" y2="448" stroke="#38BDF8" stroke-width="12" stroke-linecap="round"/>
  <line x1="64" y1="256" x2="116" y2="256" stroke="#38BDF8" stroke-width="12" stroke-linecap="round"/>
  <line x1="396" y1="256" x2="448" y2="256" stroke="#38BDF8" stroke-width="12" stroke-linecap="round"/>

  <!-- Manager / Tactical Nodes -->
  <circle cx="170" cy="170" r="14" fill="#F43F5E"/>
  <circle cx="342" cy="170" r="14" fill="#F43F5E"/>
  <circle cx="256" cy="350" r="14" fill="#10B981"/>
</svg>
